<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="950" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#17283d">ZOMATO-INSPIRED FOOD ORDERING APP</text><text x="950" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#526176">Implemented AWS deployment architecture  |  Mumbai Region (ap-south-1)</text><rect x="745" y="112" width="410" height="66" rx="18" fill="#e8f1ff" stroke="#6a9be8" stroke-width="2.5"/><text x="950.0" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#24558b">Customers / Web browsers</text><text x="950.0" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Customer visits the food-ordering application</text><rect x="865" y="202" width="170" height="50" rx="18" fill="#f0f4f8" stroke="#9aaabd" stroke-width="2.5"/><text x="950.0" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1c2b3a">Internet</text><polyline points="950,178 950,202" fill="none" stroke="#65758b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="975" y="196" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#526176">HTTP request</text><rect x="48" y="285" width="1804" height="990" rx="26" fill="#f1f6fd" stroke="#7b9bc6" stroke-width="3"/><text x="82" y="321" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#365d8b">AWS REGION  ·  ap-south-1 (MUMBAI)</text><rect x="82" y="350" width="1170" height="810" rx="22" fill="#f8fbff" stroke="#3d83c6" stroke-width="3"/><text x="667" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#245f97">AMAZON VPC  ·  10.42.0.0/16</text><rect x="500" y="410" width="335" height="75" rx="18" fill="#e8f5ff" stroke="#58a4d6" stroke-width="2.5"/><text x="667.5" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#21658e">Internet Gateway</text><text x="667.5" y="471" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Public internet connectivity</text><rect x="440" y="525" width="455" height="92" rx="18" fill="#dcecff" stroke="#3b7bc2" stroke-width="2.5"/><text x="667.5" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#205a95">Application Load Balancer</text><text x="667.5" y="586" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#526176">Internet-facing  ·  HTTP port 80</text><text x="667.5" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#526176">Deployed across both public subnets</text><rect x="495" y="665" width="345" height="73" rx="18" fill="#eaf4ff" stroke="#78a5d3" stroke-width="2.5"/><text x="667.5" y="699" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#285d8d">ALB Target Group</text><text x="667.5" y="726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">HTTP port 8080  ·  health check: /health</text><polyline points="950,252 950,325 667,325 667,410" fill="none" stroke="#65758b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="685" y="316" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#526176">Public route</text><polyline points="667,485 667,525" fill="none" stroke="#65758b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="690" y="514" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#526176">HTTP :80</text><polyline points="667,617 667,665" fill="none" stroke="#65758b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="690" y="650" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#526176">Forward request</text><rect x="125" y="800" width="510" height="240" rx="18" fill="#f2f7fc" stroke="#9cb8d6" stroke-width="2"/><text x="380" y="835" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#476989">PUBLIC SUBNET  ·  AVAILABILITY ZONE A</text><rect x="170" y="870" width="420" height="118" rx="18" fill="#e4f5ea" stroke="#5ba477" stroke-width="2.5"/><text x="380.0" y="904" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#256443">EC2 application instance</text><text x="380.0" y="931" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Amazon Linux 2023  ·  default type: t3.micro</text><text x="380.0" y="954" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Python backend  ·  port 8080</text><text x="380.0" y="977" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Initial desired capacity: one instance</text><rect x="695" y="800" width="510" height="240" rx="18" fill="#f2f7fc" stroke="#9cb8d6" stroke-width="2"/><text x="950" y="835" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#476989">PUBLIC SUBNET  ·  AVAILABILITY ZONE B</text><rect x="740" y="870" width="420" height="118" rx="18" fill="#fff1d9" stroke="#d5a04e" stroke-width="2.5"/><text x="950.0" y="904" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#875817">EC2 application instance</text><text x="950.0" y="931" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Same launch template and application</text><text x="950.0" y="954" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Possible additional instance after scale-out</text><polyline points="595,738 595,770 380,770 380,870" fill="none" stroke="#4f8f6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="745,738 745,770 950,770 950,870" fill="none" stroke="#4f8f6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="385" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#3f7959">Healthy target</text><text x="950" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#3f7959">When launched + healthy</text><rect x="125" y="1060" width="510" height="75" rx="14" fill="#fff7f6" stroke="#d58d85" stroke-width="2"/><text x="380" y="1088" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9b5149">SECURITY GROUP FLOW</text><text x="380" y="1112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6b4d4a">ALB: inbound :80  |  EC2: :8080 from ALB SG only  |  No SSH</text><rect x="695" y="1060" width="510" height="75" rx="14" fill="#ffffff" stroke="#b8c6d8" stroke-width="2"/><text x="950" y="1088" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#35516d">APPLICATION ENDPOINTS</text><text x="950" y="1112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#526176">/api/restaurants  ·  /api/orders  ·  /api/info  ·  /health  ·  /api/cpu</text><rect x="1290" y="350" width="525" height="785" rx="22" fill="#ffffff" stroke="#c6b6e5" stroke-width="2.5"/><text x="1552" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#624c91">MONITORING &amp; SCALING CONTROL</text><rect x="1350" y="425" width="405" height="88" rx="18" fill="#f0eafe" stroke="#9275c7" stroke-width="2.5"/><text x="1552.5" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#624c91">Amazon CloudWatch</text><text x="1552.5" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">EC2 / ALB metrics, alarms and scaling activity</text><rect x="1350" y="565" width="405" height="100" rx="18" fill="#fff3e3" stroke="#d28b32" stroke-width="2.5"/><text x="1552.5" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#8b5c1d">Target-tracking scaling policy</text><text x="1552.5" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Average EC2 CPU target: 35%</text><text x="1552.5" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Instance warmup: 120 seconds</text><rect x="1350" y="715" width="405" height="120" rx="18" fill="#fff8e9" stroke="#d28b32" stroke-width="2.5"/><text x="1552.5" y="749" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#8b5c1d">EC2 Auto Scaling Group</text><text x="1552.5" y="776" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Minimum: 1  ·  Desired: 1  ·  Maximum: 2</text><text x="1552.5" y="799" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Uses both public subnets / Availability Zones</text><rect x="1350" y="910" width="405" height="105" rx="18" fill="#e8f5f8" stroke="#5a9eab" stroke-width="2.5"/><text x="1552.5" y="944" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#286a76">AWS CloudFormation</text><text x="1552.5" y="971" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Provisions VPC, networking, ALB, launch template,</text><text x="1552.5" y="994" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Auto Scaling Group and scaling policy</text><polyline points="1160,920 1260,920 1260,470 1350,470" fill="none" stroke="#9275c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="1270" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#765aa6">EC2 CPU metrics</text><polyline points="1260,470 1350,470" fill="none" stroke="#9275c7" stroke-width="3" marker-end="url(#purpleArrow)"/><polyline points="1552,513 1552,565" fill="none" stroke="#9275c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="1552" y1="665" x2="1552" y2="715" stroke="#d28b32" stroke-width="3" marker-end="url(#orangeArrow)"/><text x="1580" y="697" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#98631f">Scaling decision</text><line x1="1350" y1="775" x2="1255" y2="775" stroke="#d28b32" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#orangeArrow)"/><polyline points="1350,960 1270,960 1270,1145 1218,1145" fill="none" stroke="#5a9eab" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="950" y="1207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">The stack starts with one desired EC2 instance. A second instance is possible after scale-out or a manual capacity change.</text><text x="950" y="1233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Single-region deployment only. Hyderabad / Route 53 multi-region failover is proposed, not deployed.</text><text x="950" y="1259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#526176">Demo orders are stored in instance memory; no shared persistent database is deployed.</text></svg>