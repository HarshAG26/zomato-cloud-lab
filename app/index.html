<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zomato Cloud Lab</title><style>body{font-family:system-ui,Arial;margin:0;background:#fafafa;color:#222}main{max-width:720px;margin:60px auto;padding:24px}h1{color:#e23744}p{color:#666}.card{background:white;border:1px solid #e5e5e5;border-radius:12px;padding:18px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}button{background:#e23744;border:0;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}small{color:#666}#status{min-height:25px}</style></head><body><main><h1>Zomato Cloud Lab</h1><p>Minimal educational food-ordering demo · AWS scaling experiment</p><small id="info">Loading region...</small><h2>Restaurants</h2><section id="restaurants">Loading...</section><p id="status" role="status"></p><small>Demo orders are temporary and stored separately on each instance. No payment or real delivery.</small></main><script>async function load(){try{const [r,i]=await Promise.all([fetch('/api/restaurants'),fetch('/api/info')]);const data=await r.json(),info=await i.json();document.getElementById('info').textContent=`Region: ${info.region} · Instance: ${info.instance}`;const root=document.getElementById('restaurants');root.replaceChildren();for(const x of data.restaurants){const div=document.createElement('div');div.className='card';const label=document.createElement('span');label.textContent=`${x.name} — ${x.dish} · ₹${x.price}`;const b=document.createElement('button');b.textContent='Order';b.onclick=()=>order(x.id);div.append(label,b);root.append(div)}}catch(e){document.getElementById('status').textContent='Backend unavailable'}}async function order(id){try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({restaurant_id:id})});const d=await r.json();document.getElementById('status').textContent=d.message||d.error}catch(e){document.getElementById('status').textContent='Request failed'}}load();</script></body></html>
